<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="t d"><title id="t">Settlement economics</title><desc id="d">Visual comparison between AgentPay settlement cost and API route prices.</desc><rect width="900" height="620" fill="#f5f4ee"/><g font-family="Arial,sans-serif"><text x="55" y="70" fill="#657064" font-size="16" letter-spacing="4">SETTLEMENT ECONOMICS</text><text x="55" y="120" fill="#172018" font-size="37" font-weight="700">Micropayments only work when gas stays small.</text><text x="55" y="180" fill="#657064" font-size="17">Measured settlement gas: 80,123 · BOT Chain mainnet 677</text><g transform="translate(55 235)"><text x="0" y="22" fill="#172018" font-size="19" font-weight="700">Facilitator gas</text><rect x="0" y="42" width="110" height="48" fill="#172018"/><text x="125" y="73" fill="#172018" font-size="19">0.0016 BOT</text><text x="0" y="147" fill="#172018" font-size="19" font-weight="700">Cheapest call</text><rect x="0" y="167" width="245" height="48" fill="#8fae55"/><text x="260" y="198" fill="#172018" font-size="19">0.001 USDT</text><text x="0" y="272" fill="#172018" font-size="19" font-weight="700">Log scan</text><rect x="0" y="292" width="680" height="48" fill="#b8f45c"/><text x="695" y="323" text-anchor="end" fill="#172018" font-size="19">0.010 USDT</text></g><line x1="55" y1="555" x2="845" y2="555" stroke="#ccd2c8"/><text x="55" y="590" fill="#657064" font-size="16">Batch multiple vouchers into one settle() transaction to improve the margin.</text></g></svg>