<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="t d"><title id="t">EIP-712 voucher anatomy</title><desc id="d">The signed fields in an AgentPay voucher.</desc><rect width="900" height="620" fill="#f5f4ee"/><g font-family="Arial,sans-serif"><text x="55" y="70" fill="#657064" font-size="16" letter-spacing="4">VOUCHER ANATOMY</text><text x="55" y="120" fill="#172018" font-size="37" font-weight="700">The agent signs intent, not a transaction.</text><rect x="55" y="175" width="790" height="350" rx="4" fill="#fff" stroke="#ccd2c8"/><g font-family="monospace" font-size="20"><text x="90" y="230" fill="#69746b">agent</text><text x="325" y="230" fill="#172018">0xAgent…</text><text x="90" y="275" fill="#69746b">payee</text><text x="325" y="275" fill="#172018">0xService…</text><text x="90" y="320" fill="#69746b">amount</text><text x="325" y="320" fill="#172018">10000</text><text x="90" y="365" fill="#69746b">invoice</text><text x="325" y="365" fill="#172018">0x7a1f…</text><text x="90" y="410" fill="#69746b">expiry</text><text x="325" y="410" fill="#172018">+300s</text><text x="90" y="455" fill="#69746b">chainId</text><text x="325" y="455" fill="#172018">677</text><text x="90" y="500" fill="#69746b">vault</text><text x="325" y="500" fill="#172018">0xAd0642…f038C</text></g><rect x="626" y="210" width="170" height="56" rx="2" fill="#b8f45c"/><text x="711" y="246" text-anchor="middle" fill="#172018" font-size="17" font-weight="700">SIGNED OFF-CHAIN</text><text x="55" y="578" fill="#657064" font-size="17">Replay-proof invoice · domain-bound signature · no payer gas</text></g></svg>