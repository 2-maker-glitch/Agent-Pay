<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">AgentPay payment flow</title><desc id="d">An agent receives HTTP 402, signs a voucher, the facilitator settles through the AgentPay vault on BOT Chain, and data returns.</desc><rect width="1200" height="620" fill="#101410"/><g fill="none" stroke="#303b31" stroke-width="2"><path d="M180 310H370M490 310H680M800 310H990"/><path d="M360 300l14 10-14 10M670 300l14 10-14 10M980 300l14 10-14 10"/></g><g font-family="Arial,sans-serif"><text x="60" y="78" fill="#9cab9d" font-size="18" letter-spacing="4">THE PAYMENT PATH</text><text x="60" y="128" fill="#f4f7f2" font-size="38" font-weight="700">One signature. One settlement. No gas for the agent.</text><g><rect x="55" y="230" width="235" height="165" rx="4" fill="#181e18" stroke="#354338"/><circle cx="112" cy="282" r="23" fill="#b8f45c"/><path d="M101 282h22m-11-11v22" stroke="#101410" stroke-width="3"/><text x="85" y="344" fill="#f4f7f2" font-size="24" font-weight="700">AI agent</text><text x="85" y="371" fill="#91a093" font-size="16">asks for paid data</text></g><g><rect x="365" y="230" width="235" height="165" rx="4" fill="#181e18" stroke="#354338"/><text x="395" y="283" fill="#b8f45c" font-size="20" font-weight="700">HTTP 402</text><text x="395" y="326" fill="#f4f7f2" font-size="24" font-weight="700">Price quoted</text><text x="395" y="357" fill="#91a093" font-size="16">USDT · invoice · expiry</text></g><g><rect x="675" y="230" width="235" height="165" rx="4" fill="#181e18" stroke="#354338"/><text x="705" y="283" fill="#b8f45c" font-size="20" font-weight="700">EIP-712</text><text x="705" y="326" fill="#f4f7f2" font-size="24" font-weight="700">Voucher signed</text><text x="705" y="357" fill="#91a093" font-size="16">off-chain · zero gas</text></g><g><rect x="985" y="230" width="160" height="165" rx="4" fill="#b8f45c"/><text x="1015" y="284" fill="#101410" font-size="18" font-weight="700">BOT CHAIN</text><text x="1015" y="327" fill="#101410" font-size="23" font-weight="700">Settled</text><text x="1015" y="357" fill="#26301f" font-size="15">data + receipt</text></g><text x="60" y="520" fill="#91a093" font-size="17">AGENT</text><text x="1090" y="520" text-anchor="end" fill="#91a093" font-size="17">MAINNET 677</text><line x1="60" y1="542" x2="1140" y2="542" stroke="#354338"/></g></svg>